<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>LinkedIn feed · Offscript</title>
<meta name="description" content="Ten real LinkedIn posts. Scan the original text with Pangram and filter your feed.">
<link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head><body>
<header><div class="shell top">
<a href="#feed" class="feed-brand" aria-label="LinkedIn feed, an Offscript demo"><span class="in-mark" aria-hidden="true">in</span> LinkedIn feed</a>
<span class="demo-name">Offscript demo</span>
<nav aria-label="Main"><a href="#feed" class="home-tab"><span class="home-icon" aria-hidden="true"></span>Home</a><button type="button" id="method">About this feed</button></nav>
<button type="button" id="api-status" class="api"><i class="dot"></i><span>Checking API</span></button>
</div></header>
<main id="top" class="shell workgrid">
<div class="left-col"><section class="profile-panel"><div class="profile-cover"></div>
<div class="profile-info"><img id="profile-image" alt="" width="62" height="62" hidden><small>Featured author</small><h2>Jules Rumeau</h2><p>NASA Space Apps Challenge</p><a id="profile-source" href="#feed">View featured post</a></div></section></div>
<section id="feed" aria-labelledby="feed-title">
<div class="composer-strip"><span class="in-small" aria-hidden="true">in</span><button type="button" id="add">Add your LinkedIn post</button></div>
<div class="sectionhead"><h1 id="feed-title">Viral posts <span id="count"></span></h1>
<label class="toggle"><span>Hide AI detections</span><input type="checkbox" id="filter"><span class="track" aria-hidden="true"></span></label></div>
<p id="filter-note" class="filter-note" hidden></p><div id="cards"></div></section>
<aside><section class="panel scanpanel"><div class="panel-title"><span class="scan-icon" aria-hidden="true"></span><h2>Pangram scan</h2></div>
<div class="bigstat"><strong id="scanned">0</strong><span id="scan-total">/ 10</span></div><div class="stat-label">posts analyzed</div>
<div class="meter" id="meter" aria-hidden="true"></div><div id="legend" class="legend"></div>
<button type="button" class="dark-btn" id="scan-all">Scan the feed</button><p id="scan-progress" class="feedback" aria-live="polite"></p></section></aside>
</main>
<dialog id="modal"><button type="button" class="close" aria-label="Close dialog">×</button><div id="dialog-body"></div></dialog><div id="toast" role="status"></div>
</body></html>
